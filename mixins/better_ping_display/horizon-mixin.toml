[mod]
id = "better_ping_display"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# Runtime module in horizon-client-render (shared state, ping helpers).
[[module]]
id = "runtime"
file = "crates/horizon-client-render/src/lib.rs"
name = "better_ping_display"
source = "runtime.rs"
visibility = "pub"

# ── Tab list ─────────────────────────────────────────────────────────────────

# HEAD: measure ping text widths and stash layout info.
[[injection]]
id = "tab-layout-head"
target = "horizon_client_render::tab_list::TabList::layout"
kind = "HEAD"
helper = "tab_head.rs"
bindings = [
  { name = "tab_i", ty = "&TabInputs<'_>", value = "i" },
  { name = "font", ty = "&Font", value = "font" },
]

# RETURN: size columns and replace ping sprites with right-aligned numeric text.
[[injection]]
id = "tab-layout-return"
target = "horizon_client_render::tab_list::TabList::layout"
kind = "RETURN"
helper = "tab_return.rs"
bindings = [
  { name = "value", ty = "Vec<GuiDraw>", value = "$value" },
]

# ── Server list ───────────────────────────────────────────────────────────────

# HEAD: pre-compute per-row ping ms map before the draw loop.
[[injection]]
id = "server-draw-head"
target = "horizon_client::multiplayer::Screen::draw"
kind = "HEAD"
helper = "server_head.rs"
bindings = [
  { name = "screen_self", ty = "&Screen", value = "self" },
]

# RETURN on draw_server_icon: map row y coordinate to ping ms.
[[injection]]
id = "server-icon-return"
target = "horizon_client::multiplayer::draw_server_icon"
kind = "RETURN"
helper = "server_return.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "y", ty = "f32", value = "y" },
]

# OVERWRITE on HudBatch::sprite_scaled: replace ping bars with colored numeric text.
[[injection]]
id = "server-sprite-overwrite"
target = "horizon_client_render::hud::HudBatch::sprite_scaled"
kind = "OVERWRITE"
helper = "sprite_scaled.rs"
bindings = [
  { name = "batch", ty = "&mut HudBatch", value = "self" },
  { name = "atlas", ty = "&HudAtlas", value = "atlas" },
  { name = "name", ty = "&str", value = "name" },
  { name = "x", ty = "f32", value = "x" },
  { name = "y", ty = "f32", value = "y" },
  { name = "w", ty = "f32", value = "w" },
  { name = "h", ty = "f32", value = "h" },
  { name = "color", ty = "u32", value = "color" },
]

# OVERWRITE on HudBatch::text_styled: shift server player count left if ping text expanded.
[[injection]]
id = "server-text-styled-overwrite"
target = "horizon_client_render::hud::HudBatch::text_styled"
kind = "OVERWRITE"
helper = "text_styled.rs"
bindings = [
  { name = "batch", ty = "&mut HudBatch", value = "self" },
  { name = "atlas", ty = "&HudAtlas", value = "atlas" },
  { name = "text", ty = "&crate::text::Text", value = "text" },
  { name = "x", ty = "f32", value = "x" },
  { name = "y", ty = "f32", value = "y" },
  { name = "color", ty = "u32", value = "color" },
  { name = "shadow", ty = "bool", value = "shadow" },
]

# ── Settings ──────────────────────────────────────────────────────────────────

[[injection]]
id = "settings-mods"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "mods.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<NativeMod>", value = "mods" },
]

[[injection]]
id = "settings-buttons"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "buttons" },
]

[[injection]]
id = "settings-click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "settings_click.rs"
bindings = [
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
